[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "html-table-rescuer"
version = "0.4.0"
description = "Extracts HTML tables and converts them to Markdown, preserving structure via row/colspan handling."
readme = "README.md"
authors = [{ name = "Encephos", email = "magiltraun@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
]

[project.scripts]
html-table-rescuer = "html_table_rescuer.cli:app"

# Optionale Abhängigkeiten (Extras)
[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.8.0",
]
langchain = [
    "langchain-core",
    "langchain-community",
]
llamaindex = [
    "llama-index-core",
]
haystack = [
    "haystack-ai>=2.0",
]
benchmark = [
    "pandas>=2.0",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/Encephos/html-table-rescuer"
Repository = "https://github.com/Encephos/html-table-rescuer"

# Teilt setuptools mit, wo der Code liegt
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
html_table_rescuer = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Bewusst minimales Set: Fehler + Imports, kein Umstylen von Bestandscode
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
